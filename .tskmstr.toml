[backend]
provider = "github"

[backend.github]
repo = "jowi-dev/pckr"

[agent]
runner = "claude"

[work.lanes.pckr]
repo = "."
base_branch = "main"
prompt_file = ".tskmstr/prompts/pckr-lane.md"
model = "opus"


[work.merge]
# Explicit because the conflict session passes only this key to the claude
# adapter, which substitutes its own `fable` default when it is unset (it
# does not consult [work] default_model the way lane runs do). Conflict
# resolution is bounded mechanical work, so it runs on sonnet.
model = "opus"
